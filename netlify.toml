[build]
  # DEMO MODE: publishes the example persona with [EDIT] badges, noindex on
  # every page and an X-Robots-Tag: noindex header on every file.
  # AT LAUNCH, once `npm run check-content` reports nothing left, change this
  # one line to `command = "npm run build"` (strict: fails on any placeholder).
  command = "npm run build:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys stay demo builds, before and after launch:
# placeholders shown as badges, and never indexed.
[context.deploy-preview]
  command = "npm run build:demo"

[context.branch-deploy]
  command = "npm run build:demo"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
