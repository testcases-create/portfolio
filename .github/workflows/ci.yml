name: CI

on:
  push:
  pull_request:
  # Started by the "Precompute attention" workflow on the branch it opens a
  # pull request from (its own push can't trigger this workflow).
  workflow_dispatch:

# On other branches a newer push replaces the branch's older run. On main every
# commit gets its own result: each commit is its own group, so nothing cancels
# or replaces it (one group per branch would still drop a queued run when a
# third commit arrived).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint and format
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Placeholder report
        run: npm run check-content

      # Placeholders are expected until the owner fills them in (CONTENT_GUIDE.md),
      # so CI builds the preview variant. Netlify production builds stay strict.
      - name: Build (preview)
        run: npm run build:preview
      - name: JS and font budgets
        run: npm run budgets

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - name: Lighthouse CI
        run: npm run lhci

      # Last, because it replaces dist/: the build Netlify publishes until launch.
      - name: Demo build (noindex, badges, no sitemap)
        run: npm run build:demo && npm run check-demo

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
