name: Precompute attention

# Runs scripts/precompute-attention.py on GitHub's runners, which can reach
# Hugging Face, and opens a pull request with the new public/lab/attention.json.
# Start it from the Actions tab: "Precompute attention" → "Run workflow".
#
# For the pull request step, the repository must allow it: Settings → Actions →
# General → Workflow permissions → tick "Allow GitHub Actions to create and
# approve pull requests".
#
# The pull request has to pass CI first time, so this workflow also updates
# every file generated from the content (CONTENT_GUIDE.md lists the sample's
# placeholder, which the real data removes), runs the unit tests and lint, and
# then starts CI on the new branch itself: pushes and pull requests made with
# the workflow's own token don't trigger other workflows, but a
# workflow_dispatch does.
on:
  workflow_dispatch:
    inputs:
      model:
        description: A causal language model on the Hugging Face hub
        default: distilgpt2
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write # to start CI on the new branch

concurrency:
  group: precompute-attention
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch (CPU) and Transformers
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers
      - name: Compute attention
        run: python scripts/precompute-attention.py --model "$MODEL"

      # Check the new file the way the site will use it before proposing it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the data
        run: |
          node -e "
            const fs = require('fs');
            const zlib = require('zlib');
            const file = JSON.parse(fs.readFileSync('public/lab/attention.json', 'utf8'));
            if (file.source !== 'model') throw new Error('expected source: model');
            const size = zlib.gzipSync(fs.readFileSync('public/lab/attention.json'), { level: 9 }).length;
            console.log('attention.json:', (size / 1000).toFixed(1), 'KB gzipped (budget 120 KB)');
            if (size > 120000) throw new Error('over the 120 KB budget');
          "
      # Files generated from the content must follow it, or CI's freshness test fails.
      - name: Regenerate the content guide
        run: npm run content-guide
      - name: Unit tests and lint, as CI runs them
        run: |
          npm test
          npm run lint

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY: >-
            Computed by the "Precompute attention" workflow with
            scripts/precompute-attention.py. It replaces the rule-based sample,
            so the Lab's "sample data" notice disappears and the file no longer
            blocks a production build. CONTENT_GUIDE.md is regenerated to match.
            The unit tests, lint and the 120 KB budget passed in the workflow,
            and the workflow started CI on this branch, so its checks appear
            here as usual.
        run: |
          if git diff --quiet -- public/lab/attention.json; then
            echo "attention.json is unchanged; nothing to propose."
            exit 0
          fi
          branch="attention-data/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/lab/attention.json CONTENT_GUIDE.md
          git commit -m "feat(lab): attention data computed from $MODEL"
          git push origin "$branch"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "feat(lab): real attention data from $MODEL" \
            --body "$BODY Model: $MODEL. Run: $RUN_URL"
          # The push above doesn't trigger CI (it was made with this workflow's
          # token), so start it explicitly; its checks attach to the branch's commit.
          gh workflow run ci.yml --ref "$branch"
