nodes:
  - { id: client, label: Product services, kind: client }
  - { id: gateway, label: Inference gateway, kind: gateway }
  - { id: limits, label: Rate limits (Redis), kind: store }
  - { id: cache, label: Response cache (Redis), kind: cache }
  - { id: batcher, label: Batcher, kind: service }
  - { id: model, label: Triton model servers, kind: model }
edges:
  - { from: client, to: gateway, label: gRPC }
  - { from: gateway, to: limits }
  - { from: gateway, to: cache }
  - { from: gateway, to: batcher }
  - { from: batcher, to: model, label: batched }
flows:
  - { name: Cache hit, path: [client, gateway, cache] }
  - { name: Cache miss, path: [client, gateway, batcher, model] }
  - { name: Rate check, path: [client, gateway, limits] }
